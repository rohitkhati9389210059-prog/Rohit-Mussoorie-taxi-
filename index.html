<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohit Mussoorie Taxi Service</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}
.card{max-width:520px;margin:40px auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 4px 18px #0002}
h1{margin-top:0}
input,select,textarea{width:100%;box-sizing:border-box;padding:13px;margin:8px 0 14px;border:1px solid #ccc;border-radius:10px;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#25D366;color:white;font-size:18px;font-weight:bold;cursor:pointer}
.small{color:#666;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1>🚕 Rohit Mussoorie Taxi Service</h1>
<p>Mussoorie • Dehradun • Airport Pickup & Drop • Local & Outstation</p>
<label>नाम</label>
<input id="name" placeholder="अपना नाम">
<label>यात्रा की तारीख</label>
<input id="date" type="date">
<label>कहाँ से जाना है?</label>
<input id="from" placeholder="Pickup location">
<label>कहाँ जाना है?</label>
<input id="to" placeholder="Drop location">
<label>यात्रियों की संख्या</label>
<input id="people" type="number" min="1" placeholder="जैसे 2">
<label>अतिरिक्त जानकारी</label>
<textarea id="note" placeholder="Car type / pickup time आदि"></textarea>
<button onclick="book()">WhatsApp पर Taxi Book करें</button>
<p class="small">बटन दबाने पर आपकी जानकारी WhatsApp पर भेजने के लिए संदेश तैयार होगा।</p>
</div>
<script>
function book(){
 const n=document.getElementById('name').value;
 const d=document.getElementById('date').value;
 const f=document.getElementById('from').value;
 const t=document.getElementById('to').value;
 const p=document.getElementById('people').value;
 const note=document.getElementById('note').value;
 const msg=`नमस्ते Rohit Mussoorie Taxi Service,%0A%0Aमुझे टैक्सी बुक करनी है।%0Aनाम: ${n}%0Aतारीख: ${d}%0APickup: ${f}%0ADrop: ${t}%0Aयात्री: ${p}%0Aजानकारी: ${note}`;
 window.location.href='https://wa.me/919389210059?text='+msg;
}
</script>
</body>
</html>
